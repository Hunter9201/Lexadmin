<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex · Admin Panel (Lawyer Profiles + Updates)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 32px; padding: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        h2 { font-size: 1.2rem; margin: 1.5rem 0 1rem; border-left: 4px solid #1e4a6e; padding-left: 12px; }
        .form-group { margin-bottom: 1.2rem; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid #cbd5e1; font-family: inherit; }
        button { background: #1e4a6e; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-right: 8px; }
        .btn-secondary { background: #4b5563; }
        .btn-danger { background: #b91c1c; }
        .status { margin-top: 1rem; padding: 10px; border-radius: 20px; font-size: 0.85rem; display: none; }
        .success { background: #dcfce7; color: #166534; display: block; }
        .error { background: #fee2e2; color: #991b1b; display: block; }
        hr { margin: 1.5rem 0; }
        .lawyer-list { margin-top: 1rem; }
        .lawyer-item { background: #f8fafc; border-radius: 60px; padding: 10px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .token-info { font-size: 0.7rem; color: #4b5563; margin-top: 4px; }
        .mode-badge { background: #eef2ff; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; display: inline-block; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-gavel"></i> Lex Admin Panel</h1>
    <div id="modeDisplay" class="mode-badge"></div>

    <div class="form-group">
        <label><i class="fab fa-github"></i> GitHub Token (repo scope)</label>
        <input type="password" id="githubToken" placeholder="github_pat_xxx...">
        <div class="token-info">Required for all write operations. Stored locally in your browser.</div>
    </div>

    <!-- ========== SECTION 1: MANAGE LAWYERS (Master Admin) ========== -->
    <div id="manageLawyersSection">
        <h2><i class="fas fa-users"></i> Manage Lawyer Profiles</h2>
        <div class="form-group">
            <label>Lawyer ID (unique number)</label>
            <input type="number" id="lawyerId" placeholder="e.g., 1, 2, 3...">
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="lawyerName" placeholder="Adv. Meera Sharma">
        </div>
        <div class="form-group">
            <label>Initials (2-3 letters)</label>
            <input type="text" id="lawyerInitials" placeholder="MS">
        </div>
        <div>
            <button id="addLawyerBtn"><i class="fas fa-plus"></i> Add / Update Lawyer</button>
            <button id="deleteLawyerBtn" class="btn-danger"><i class="fas fa-trash"></i> Delete Selected</button>
        </div>
        <div id="lawyerList" class="lawyer-list"></div>
        <hr>
    </div>

    <!-- ========== SECTION 2: POST UPDATES (Selected Lawyer) ========== -->
    <div id="postUpdatesSection">
        <h2><i class="fas fa-paper-plane"></i> Post an Update</h2>
        <div class="form-group">
            <label>Select Lawyer (who is posting)</label>
            <select id="postingLawyerSelect"></select>
        </div>
        <div class="form-group">
            <label>Update Type</label>
            <select id="updateType">
                <option value="text">📝 Text</option>
                <option value="article">📰 Article link</option>
                <option value="image">🖼️ Image URL</option>
                <option value="video">🎬 Video URL (YouTube/Vimeo)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Content / Title</label>
            <textarea id="content" rows="3" placeholder="What are you working on?"></textarea>
        </div>
        <div class="form-group">
            <label>Media URL (for image, video, or article link)</label>
            <input type="url" id="mediaUrl" placeholder="https://...">
        </div>
        <button id="postUpdateBtn"><i class="fas fa-paper-plane"></i> Post Update</button>
        <div id="statusMsg" class="status"></div>
    </div>
</div>

<script>
    const GITHUB_OWNER = "hunter9201";      // CHANGE
    const GITHUB_REPO = "I";                // CHANGE
    const GITHUB_BRANCH = "main";
    const DATA_JSON_PATH = "lex_data.json";
    const EXPIRY_HOURS = 48;

    let currentData = { lawyers: [], updates: [] };
    let currentSha = null;

    function ghHeaders(token) {
        return {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Authorization": "Bearer " + token
        };
    }

    async function fetchData(token) {
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_JSON_PATH}?ref=${GITHUB_BRANCH}`;
        try {
            const res = await fetch(url, { headers: ghHeaders(token) });
            if (res.status === 404) return { exists: false, sha: null, data: { lawyers: [], updates: [] } };
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const content = atob(json.content);
            const data = JSON.parse(content);
            return { exists: true, sha: json.sha, data: data };
        } catch (err) {
            throw new Error("Fetch failed: " + err.message);
        }
    }

    async function saveData(data, sha, token) {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_JSON_PATH}`;
        const body = { message: "Update lex data", content: content, branch: GITHUB_BRANCH };
        if (sha) body.sha = sha;
        const res = await fetch(url, {
            method: "PUT",
            headers: { ...ghHeaders(token), "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`Save failed: ${res.status}`);
        const result = await res.json();
        return result.content.sha;
    }

    async function loadData(token) {
        const { exists, sha, data } = await fetchData(token);
        currentData = data;
        currentSha = sha;
        renderLawyerList();
        renderLawyerSelect();
    }

    function renderLawyerList() {
        const container = document.getElementById("lawyerList");
        if (!container) return;
        if (currentData.lawyers.length === 0) {
            container.innerHTML = "<div class='lawyer-item'>No lawyers yet. Add one above.</div>";
            return;
        }
        container.innerHTML = "";
        currentData.lawyers.forEach(l => {
            const div = document.createElement("div");
            div.className = "lawyer-item";
            div.innerHTML = `
                <span><strong>${escapeHtml(l.name)}</strong> (ID: ${l.id}, Initials: ${l.initials})</span>
                <button class="select-lawyer-btn" data-id="${l.id}" style="background:#1e4a6e; padding:4px 12px;">Select to Edit</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll(".select-lawyer-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                const lawyer = currentData.lawyers.find(l => l.id === id);
                if (lawyer) {
                    document.getElementById("lawyerId").value = lawyer.id;
                    document.getElementById("lawyerName").value = lawyer.name;
                    document.getElementById("lawyerInitials").value = lawyer.initials;
                }
            });
        });
    }

    function renderLawyerSelect() {
        const select = document.getElementById("postingLawyerSelect");
        if (!select) return;
        select.innerHTML = "";
        if (currentData.lawyers.length === 0) {
            select.innerHTML = "<option disabled>No lawyers – create one first</option>";
            return;
        }
        currentData.lawyers.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = `${l.name} (ID ${l.id})`;
            select.appendChild(opt);
        });
    }

    async function addOrUpdateLawyer(token) {
        const id = parseInt(document.getElementById("lawyerId").value);
        const name = document.getElementById("lawyerName").value.trim();
        const initials = document.getElementById("lawyerInitials").value.trim().toUpperCase();
        if (!id || !name || !initials) {
            showStatus("Please fill all fields.", "error");
            return;
        }
        const existingIndex = currentData.lawyers.findIndex(l => l.id === id);
        if (existingIndex !== -1) {
            currentData.lawyers[existingIndex] = { id, name, initials };
        } else {
            currentData.lawyers.push({ id, name, initials });
            // Also ensure updates array has entry
            if (!currentData.updates.find(u => u.lawyerId === id)) {
                currentData.updates.push({ lawyerId: id, updates: [] });
            }
        }
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("Lawyer saved successfully.", "success");
            await loadData(token);
        } catch (err) {
            showStatus("Error: " + err.message, "error");
        }
    }

    async function deleteLawyer(token) {
        const id = parseInt(document.getElementById("lawyerId").value);
        if (!id) {
            showStatus("Enter a Lawyer ID to delete.", "error");
            return;
        }
        if (!confirm(`Delete lawyer ID ${id} and all their updates?`)) return;
        currentData.lawyers = currentData.lawyers.filter(l => l.id !== id);
        currentData.updates = currentData.updates.filter(u => u.lawyerId !== id);
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("Lawyer deleted.", "success");
            document.getElementById("lawyerId").value = "";
            document.getElementById("lawyerName").value = "";
            document.getElementById("lawyerInitials").value = "";
            await loadData(token);
        } catch (err) {
            showStatus("Error: " + err.message, "error");
        }
    }

    async function postUpdate(token) {
        const lawyerId = parseInt(document.getElementById("postingLawyerSelect").value);
        if (!lawyerId) {
            showStatus("Select a lawyer first.", "error");
            return;
        }
        const type = document.getElementById("updateType").value;
        const content = document.getElementById("content").value.trim();
        const mediaUrl = document.getElementById("mediaUrl").value.trim();
        if (!content && type !== "image" && type !== "video") {
            showStatus("Please enter content for text/article updates.", "error");
            return;
        }
        if ((type === "image" || type === "video" || type === "article") && !mediaUrl) {
            showStatus("Please provide a URL for this update type.", "error");
            return;
        }
        let lawyerUpdates = currentData.updates.find(u => u.lawyerId === lawyerId);
        if (!lawyerUpdates) {
            lawyerUpdates = { lawyerId, updates: [] };
            currentData.updates.push(lawyerUpdates);
        }
        // Check daily limit (20)
        const oneDay = 24 * 60 * 60 * 1000;
        const now = Date.now();
        const todayUpdates = lawyerUpdates.updates.filter(up => (now - new Date(up.timestamp).getTime()) < oneDay);
        if (todayUpdates.length >= 20) {
            showStatus("Daily limit reached (20 updates per day).", "error");
            return;
        }
        const newUpdate = {
            id: Date.now() + Math.random(),
            type: type,
            content: content,
            mediaUrl: mediaUrl || null,
            timestamp: new Date().toISOString(),
            expiresAt: new Date(Date.now() + EXPIRY_HOURS * 60 * 60 * 1000).toISOString()
        };
        lawyerUpdates.updates.push(newUpdate);
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("✅ Update posted! Appears on main site within 30 sec.", "success");
            document.getElementById("content").value = "";
            document.getElementById("mediaUrl").value = "";
            await loadData(token);
        } catch (err) {
            showStatus("Error: " + err.message, "error");
        }
    }

    function showStatus(msg, type) {
        const div = document.getElementById("statusMsg");
        div.textContent = msg;
        div.className = `status ${type}`;
        setTimeout(() => div.className = "status", 4000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // Event listeners
    document.getElementById("addLawyerBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await addOrUpdateLawyer(token);
    });
    document.getElementById("deleteLawyerBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await deleteLawyer(token);
    });
    document.getElementById("postUpdateBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await postUpdate(token);
    });

    // Auto-load if token already in localStorage
    const storedToken = localStorage.getItem("lex_admin_token");
    if (storedToken) {
        document.getElementById("githubToken").value = storedToken;
        loadData(storedToken).catch(console.warn);
    }
    document.getElementById("githubToken").addEventListener("input", (e) => {
        const token = e.target.value.trim();
        if (token) {
            localStorage.setItem("lex_admin_token", token);
            loadData(token).catch(console.warn);
        }
    });
    document.getElementById("modeDisplay").innerHTML = '<i class="fas fa-shield-alt"></i> Master admin: you can add/edit lawyers AND post updates for any lawyer.';
</script>
</body>
</html>
