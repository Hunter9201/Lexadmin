<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex · Admin Panel (Full Management)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 32px; padding: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 1.6rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        h2 { font-size: 1.2rem; margin: 1.5rem 0 1rem; border-left: 4px solid #1e4a6e; padding-left: 12px; }
        .form-group { margin-bottom: 1.2rem; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid #cbd5e1; font-family: inherit; }
        button { background: #1e4a6e; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-right: 8px; }
        .btn-secondary { background: #4b5563; }
        .btn-danger { background: #b91c1c; }
        .btn-warning { background: #eab308; color: #1f2937; }
        .status { margin-top: 1rem; padding: 10px; border-radius: 20px; font-size: 0.85rem; display: none; }
        .success { background: #dcfce7; color: #166534; display: block; }
        .error { background: #fee2e2; color: #991b1b; display: block; }
        hr { margin: 1.5rem 0; }
        .lawyer-list, .updates-list { margin-top: 1rem; }
        .lawyer-item, .update-item { background: #f8fafc; border-radius: 60px; padding: 10px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .update-item { border-radius: 20px; flex-direction: column; align-items: stretch; }
        .update-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .update-details { font-size: 0.85rem; color: #4b5563; margin-top: 8px; padding: 8px; background: #fff; border-radius: 16px; }
        .token-info { font-size: 0.7rem; color: #4b5563; margin-top: 4px; }
        .mode-badge { background: #eef2ff; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; display: inline-block; margin-bottom: 1rem; }
        .preview { margin-top: 8px; max-width: 100%; max-height: 150px; border-radius: 16px; display: none; }
        .file-info { font-size: 0.75rem; color: #4b5563; margin-top: 6px; }
        .edit-form { background: #f1f5f9; padding: 12px; border-radius: 20px; margin-top: 12px; display: none; }
        .edit-form.active { display: block; }
        .inline-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-gavel"></i> Lex Admin Panel – Full Management</h1>
    <div id="modeDisplay" class="mode-badge"></div>

    <div class="form-group">
        <label><i class="fab fa-github"></i> GitHub Token (repo scope)</label>
        <input type="password" id="githubToken" placeholder="github_pat_xxx...">
        <div class="token-info">Required for all write operations. Stored locally in your browser.</div>
    </div>

    <!-- ========== SECTION 1: MANAGE LAWYERS ========== -->
    <div id="manageLawyersSection">
        <h2><i class="fas fa-users"></i> Manage Lawyer Profiles</h2>
        <div class="form-group">
            <label>Lawyer ID (unique number)</label>
            <input type="number" id="lawyerId" placeholder="e.g., 1, 2, 3...">
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="lawyerName" placeholder="Adv. Meera Sharma">
        </div>
        <div class="form-group">
            <label>Initials (2-3 letters)</label>
            <input type="text" id="lawyerInitials" placeholder="MS">
        </div>
        <div>
            <button id="addLawyerBtn"><i class="fas fa-plus"></i> Add / Update Lawyer</button>
            <button id="deleteLawyerBtn" class="btn-danger"><i class="fas fa-trash"></i> Delete Selected</button>
        </div>
        <div id="lawyerList" class="lawyer-list"></div>
        <hr>
    </div>

    <!-- ========== SECTION 2: POST NEW UPDATE ========== -->
    <div id="postUpdatesSection">
        <h2><i class="fas fa-paper-plane"></i> Post a New Update</h2>
        <div class="form-group">
            <label>Select Lawyer (who is posting)</label>
            <select id="postingLawyerSelect"></select>
        </div>
        <div class="form-group">
            <label>Update Type</label>
            <select id="updateType">
                <option value="text">📝 Text</option>
                <option value="article">📰 Article link</option>
                <option value="image">🖼️ Image (upload from computer)</option>
                <option value="video">🎬 Video (upload from computer, max 5MB)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Content / Title</label>
            <textarea id="content" rows="3" placeholder="What are you working on?"></textarea>
        </div>
        
        <!-- Image upload section -->
        <div id="imageUploadGroup" style="display: none;">
            <label>Upload Image from your computer</label>
            <div class="inline-buttons">
                <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif,image/webp">
                <button type="button" id="clearImageBtn" class="btn-secondary">Clear</button>
            </div>
            <img id="imagePreview" class="preview" alt="Preview">
            <div class="token-info">Image will be uploaded to GitHub.</div>
        </div>
        
        <!-- Video upload section -->
        <div id="videoUploadGroup" style="display: none;">
            <label>Upload Video from your computer (max 5MB)</label>
            <div class="inline-buttons">
                <input type="file" id="videoFileInput" accept="video/mp4,video/webm,video/quicktime,video/x-msvideo">
                <button type="button" id="clearVideoBtn" class="btn-secondary">Clear</button>
            </div>
            <div id="videoInfo" class="file-info"></div>
            <div class="token-info">Video will be uploaded to GitHub. Max 5MB.</div>
        </div>
        
        <div class="form-group" id="mediaUrlGroup">
            <label>Media URL (optional for text, required for article, or direct link)</label>
            <input type="url" id="mediaUrl" placeholder="https://...">
        </div>
        
        <button id="postUpdateBtn"><i class="fas fa-paper-plane"></i> Post Update</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <!-- ========== SECTION 3: MANAGE EXISTING UPDATES (Edit/Delete) ========== -->
    <div id="manageUpdatesSection">
        <h2><i class="fas fa-edit"></i> Manage Existing Updates (Edit / Delete)</h2>
        <div class="form-group">
            <label>Select Lawyer to view their updates</label>
            <select id="viewLawyerSelect"></select>
        </div>
        <div id="updatesList" class="updates-list"></div>
    </div>
</div>

<script>
    const GITHUB_OWNER = "hunter9201";      // CHANGE
    const GITHUB_REPO = "I";                // CHANGE
    const GITHUB_BRANCH = "main";
    const DATA_JSON_PATH = "lex_data.json";
    const UPLOAD_FOLDER = "uploads/";
    const MAX_VIDEO_SIZE_MB = 5;
    const EXPIRY_HOURS = 48;

    let currentData = { lawyers: [], updates: [] };
    let currentSha = null;
    let pendingImageFile = null;
    let pendingVideoFile = null;
    let currentlyEditingUpdateId = null;

    // Helper functions
    function ghHeaders(token) {
        return {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Authorization": "Bearer " + token
        };
    }

    async function uploadFileToGitHub(file, token) {
        const safeName = file.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
        const timestamp = Date.now();
        const filename = `${timestamp}_${safeName}`;
        const path = UPLOAD_FOLDER + filename;
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
            reader.onload = async () => {
                const base64Content = reader.result.split(',')[1];
                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
                const body = { message: `Upload file ${filename}`, content: base64Content, branch: GITHUB_BRANCH };
                try {
                    let sha = null;
                    try {
                        const checkRes = await fetch(url, { headers: ghHeaders(token) });
                        if (checkRes.ok) {
                            const existing = await checkRes.json();
                            sha = existing.sha;
                            body.sha = sha;
                        }
                    } catch(e) {}
                    const res = await fetch(url, { method: "PUT", headers: { ...ghHeaders(token), "Content-Type": "application/json" }, body: JSON.stringify(body) });
                    if (!res.ok) throw new Error(`Upload failed: ${res.status}`);
                    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
                    resolve(rawUrl);
                } catch (err) { reject(err); }
            };
            reader.onerror = () => reject(new Error("File read error"));
            reader.readAsDataURL(file);
        });
    }

    async function fetchData(token) {
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_JSON_PATH}?ref=${GITHUB_BRANCH}`;
        try {
            const res = await fetch(url, { headers: ghHeaders(token) });
            if (res.status === 404) return { exists: false, sha: null, data: { lawyers: [], updates: [] } };
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const content = atob(json.content);
            const data = JSON.parse(content);
            return { exists: true, sha: json.sha, data: data };
        } catch (err) { throw new Error("Fetch failed: " + err.message); }
    }

    async function saveData(data, sha, token) {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_JSON_PATH}`;
        const body = { message: "Update lex data", content: content, branch: GITHUB_BRANCH };
        if (sha) body.sha = sha;
        const res = await fetch(url, { method: "PUT", headers: { ...ghHeaders(token), "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error(`Save failed: ${res.status}`);
        const result = await res.json();
        return result.content.sha;
    }

    // Remove expired updates (based on expiresAt)
    function removeExpiredUpdates(data) {
        const now = Date.now();
        let changed = false;
        for (let lu of data.updates) {
            const originalLen = lu.updates.length;
            lu.updates = lu.updates.filter(up => new Date(up.expiresAt).getTime() > now);
            if (lu.updates.length !== originalLen) changed = true;
        }
        return changed;
    }

    async function loadData(token) {
        const { exists, sha, data } = await fetchData(token);
        currentData = data;
        currentSha = sha;
        // Auto-clean expired updates
        if (removeExpiredUpdates(currentData)) {
            await saveData(currentData, currentSha, token);
            currentSha = (await fetchData(token)).sha;
        }
        renderLawyerList();
        renderLawyerSelect();
        renderViewLawyerSelect();
    }

    // Render lawyers for management
    function renderLawyerList() {
        const container = document.getElementById("lawyerList");
        if (!container) return;
        if (currentData.lawyers.length === 0) {
            container.innerHTML = "<div class='lawyer-item'>No lawyers yet. Add one above.</div>";
            return;
        }
        container.innerHTML = "";
        currentData.lawyers.forEach(l => {
            const div = document.createElement("div");
            div.className = "lawyer-item";
            div.innerHTML = `
                <span><strong>${escapeHtml(l.name)}</strong> (ID: ${l.id}, Initials: ${l.initials})</span>
                <button class="select-lawyer-btn" data-id="${l.id}" style="background:#1e4a6e; padding:4px 12px;">Select to Edit</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll(".select-lawyer-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                const lawyer = currentData.lawyers.find(l => l.id === id);
                if (lawyer) {
                    document.getElementById("lawyerId").value = lawyer.id;
                    document.getElementById("lawyerName").value = lawyer.name;
                    document.getElementById("lawyerInitials").value = lawyer.initials;
                }
            });
        });
    }

    function renderLawyerSelect() {
        const select = document.getElementById("postingLawyerSelect");
        if (!select) return;
        select.innerHTML = "";
        if (currentData.lawyers.length === 0) {
            select.innerHTML = "<option disabled>No lawyers – create one first</option>";
            return;
        }
        currentData.lawyers.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = `${l.name} (ID ${l.id})`;
            select.appendChild(opt);
        });
    }

    function renderViewLawyerSelect() {
        const select = document.getElementById("viewLawyerSelect");
        if (!select) return;
        select.innerHTML = "<option value=''>-- Select Lawyer to manage updates --</option>";
        currentData.lawyers.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = `${l.name} (ID ${l.id})`;
            select.appendChild(opt);
        });
        select.onchange = () => {
            const lawyerId = parseInt(select.value);
            if (lawyerId) renderUpdatesForLawyer(lawyerId);
            else document.getElementById("updatesList").innerHTML = "";
        };
    }

    function renderUpdatesForLawyer(lawyerId) {
        const container = document.getElementById("updatesList");
        const lawyerUpdates = currentData.updates.find(u => u.lawyerId === lawyerId);
        const updates = lawyerUpdates ? lawyerUpdates.updates : [];
        if (updates.length === 0) {
            container.innerHTML = "<div class='update-item'>No updates found for this lawyer.</div>";
            return;
        }
        container.innerHTML = "";
        updates.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        updates.forEach(update => {
            const div = document.createElement("div");
            div.className = "update-item";
            div.dataset.id = update.id;
            const expiryDate = new Date(update.expiresAt).toLocaleString();
            let mediaPreview = "";
            if (update.type === "image" && update.mediaUrl) {
                mediaPreview = `<img src="${update.mediaUrl}" style="max-width:100px; max-height:60px; border-radius:8px;">`;
            } else if (update.type === "video" && update.mediaUrl) {
                mediaPreview = `<video controls style="max-width:100px; max-height:60px;"><source src="${update.mediaUrl}"></video>`;
            }
            div.innerHTML = `
                <div class="update-header">
                    <strong>${escapeHtml(update.type.toUpperCase())}</strong>
                    <span style="font-size:0.75rem;">Expires: ${expiryDate}</span>
                    <div class="inline-buttons">
                        <button class="edit-update-btn" data-id="${update.id}" data-lawyer="${lawyerId}" style="background:#eab308; color:#1f2937;">✏️ Edit</button>
                        <button class="delete-update-btn" data-id="${update.id}" data-lawyer="${lawyerId}" class="btn-danger" style="background:#b91c1c;">🗑️ Delete</button>
                    </div>
                </div>
                <div class="update-details">
                    <div><strong>Content:</strong> ${escapeHtml(update.content)}</div>
                    ${update.mediaUrl ? `<div><strong>Media URL:</strong> <a href="${update.mediaUrl}" target="_blank">${update.mediaUrl.substring(0, 50)}...</a></div>` : ''}
                    ${mediaPreview ? `<div>${mediaPreview}</div>` : ''}
                    <div><strong>Posted:</strong> ${new Date(update.timestamp).toLocaleString()}</div>
                </div>
                <div id="edit-form-${update.id}" class="edit-form"></div>
            `;
            container.appendChild(div);
        });
        // Attach event listeners
        document.querySelectorAll(".edit-update-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const updateId = parseInt(btn.dataset.id);
                const lawyerId = parseInt(btn.dataset.lawyer);
                showEditForm(updateId, lawyerId);
            });
        });
        document.querySelectorAll(".delete-update-btn").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                if (confirm("Delete this update permanently?")) {
                    const updateId = parseInt(btn.dataset.id);
                    const lawyerId = parseInt(btn.dataset.lawyer);
                    await deleteUpdate(lawyerId, updateId);
                }
            });
        });
    }

    async function deleteUpdate(lawyerId, updateId) {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        try {
            const lawyerUpdates = currentData.updates.find(u => u.lawyerId === lawyerId);
            if (lawyerUpdates) {
                lawyerUpdates.updates = lawyerUpdates.updates.filter(u => u.id !== updateId);
                const newSha = await saveData(currentData, currentSha, token);
                currentSha = newSha;
                showStatus("Update deleted successfully.", "success");
                await loadData(token);
                renderUpdatesForLawyer(lawyerId);
            }
        } catch (err) { showStatus("Delete failed: " + err.message, "error"); }
    }

    function showEditForm(updateId, lawyerId) {
        const container = document.getElementById(`edit-form-${updateId}`);
        if (!container) return;
        const lawyerUpdates = currentData.updates.find(u => u.lawyerId === lawyerId);
        const update = lawyerUpdates ? lawyerUpdates.updates.find(u => u.id === updateId) : null;
        if (!update) return;
        currentlyEditingUpdateId = updateId;
        container.innerHTML = `
            <div style="margin-top:8px;">
                <label>Edit Content</label>
                <textarea id="editContent" rows="2">${escapeHtml(update.content)}</textarea>
                <label>Edit Type</label>
                <select id="editType">
                    <option value="text" ${update.type === "text" ? "selected" : ""}>Text</option>
                    <option value="article" ${update.type === "article" ? "selected" : ""}>Article</option>
                    <option value="image" ${update.type === "image" ? "selected" : ""}>Image</option>
                    <option value="video" ${update.type === "video" ? "selected" : ""}>Video</option>
                </select>
                <label>Media URL (leave as is to keep current)</label>
                <input type="url" id="editMediaUrl" value="${escapeHtml(update.mediaUrl || '')}" placeholder="https://...">
                <div style="margin-top:8px;">
                    <button id="saveEditBtn" class="btn-secondary">Save Changes</button>
                    <button id="cancelEditBtn" class="btn-secondary" style="background:#6b7280;">Cancel</button>
                </div>
            </div>
        `;
        container.classList.add("active");
        document.getElementById("saveEditBtn").onclick = async () => {
            const newContent = document.getElementById("editContent").value.trim();
            const newType = document.getElementById("editType").value;
            let newMediaUrl = document.getElementById("editMediaUrl").value.trim();
            if (!newContent && newType !== "image" && newType !== "video") {
                showStatus("Content cannot be empty.", "error"); return;
            }
            if ((newType === "article" || newType === "image" || newType === "video") && !newMediaUrl) {
                showStatus("Media URL required for this type.", "error"); return;
            }
            update.content = newContent;
            update.type = newType;
            update.mediaUrl = newMediaUrl || null;
            // Keep same expiry, timestamp unchanged
            const token = document.getElementById("githubToken").value.trim();
            if (!token) { showStatus("Enter GitHub token.", "error"); return; }
            try {
                const newSha = await saveData(currentData, currentSha, token);
                currentSha = newSha;
                showStatus("Update edited successfully.", "success");
                await loadData(token);
                renderUpdatesForLawyer(lawyerId);
            } catch (err) { showStatus("Save failed: " + err.message, "error"); }
        };
        document.getElementById("cancelEditBtn").onclick = () => {
            container.innerHTML = "";
            container.classList.remove("active");
            currentlyEditingUpdateId = null;
        };
    }

    // Add/Update Lawyer
    async function addOrUpdateLawyer(token) {
        const id = parseInt(document.getElementById("lawyerId").value);
        const name = document.getElementById("lawyerName").value.trim();
        const initials = document.getElementById("lawyerInitials").value.trim().toUpperCase();
        if (!id || !name || !initials) { showStatus("Please fill all fields.", "error"); return; }
        const existingIndex = currentData.lawyers.findIndex(l => l.id === id);
        if (existingIndex !== -1) {
            currentData.lawyers[existingIndex] = { id, name, initials };
        } else {
            currentData.lawyers.push({ id, name, initials });
            if (!currentData.updates.find(u => u.lawyerId === id)) {
                currentData.updates.push({ lawyerId: id, updates: [] });
            }
        }
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("Lawyer saved.", "success");
            await loadData(token);
        } catch (err) { showStatus("Error: " + err.message, "error"); }
    }

    async function deleteLawyer(token) {
        const id = parseInt(document.getElementById("lawyerId").value);
        if (!id) { showStatus("Enter a Lawyer ID to delete.", "error"); return; }
        if (!confirm(`Delete lawyer ID ${id} and all their updates?`)) return;
        currentData.lawyers = currentData.lawyers.filter(l => l.id !== id);
        currentData.updates = currentData.updates.filter(u => u.lawyerId !== id);
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("Lawyer deleted.", "success");
            document.getElementById("lawyerId").value = "";
            document.getElementById("lawyerName").value = "";
            document.getElementById("lawyerInitials").value = "";
            await loadData(token);
        } catch (err) { showStatus("Error: " + err.message, "error"); }
    }

    // Post new update
    async function postUpdate(token) {
        const lawyerId = parseInt(document.getElementById("postingLawyerSelect").value);
        if (!lawyerId) { showStatus("Select a lawyer.", "error"); return; }
        const type = document.getElementById("updateType").value;
        const content = document.getElementById("content").value.trim();
        let mediaUrl = document.getElementById("mediaUrl").value.trim();
        
        if (type === "image" && pendingImageFile) {
            showStatus("Uploading image...", "success");
            try {
                mediaUrl = await uploadFileToGitHub(pendingImageFile, token);
                pendingImageFile = null;
                document.getElementById("imageFileInput").value = "";
                document.getElementById("imagePreview").style.display = "none";
            } catch (err) { showStatus("Image upload failed: " + err.message, "error"); return; }
        }
        if (type === "video" && pendingVideoFile) {
            if (pendingVideoFile.size > MAX_VIDEO_SIZE_MB * 1024 * 1024) {
                showStatus(`Video exceeds ${MAX_VIDEO_SIZE_MB}MB.`, "error"); return;
            }
            showStatus("Uploading video...", "success");
            try {
                mediaUrl = await uploadFileToGitHub(pendingVideoFile, token);
                pendingVideoFile = null;
                document.getElementById("videoFileInput").value = "";
                document.getElementById("videoInfo").innerHTML = "";
            } catch (err) { showStatus("Video upload failed: " + err.message, "error"); return; }
        }
        
        if (!content && type !== "image" && type !== "video") { showStatus("Enter content.", "error"); return; }
        if ((type === "article") && !mediaUrl) { showStatus("Provide article URL.", "error"); return; }
        if ((type === "image" || type === "video") && !mediaUrl) { showStatus("Media URL missing.", "error"); return; }
        
        let lawyerUpdates = currentData.updates.find(u => u.lawyerId === lawyerId);
        if (!lawyerUpdates) {
            lawyerUpdates = { lawyerId, updates: [] };
            currentData.updates.push(lawyerUpdates);
        }
        const oneDay = 24 * 60 * 60 * 1000;
        const now = Date.now();
        const todayUpdates = lawyerUpdates.updates.filter(up => (now - new Date(up.timestamp).getTime()) < oneDay);
        if (todayUpdates.length >= 20) { showStatus("Daily limit (20) reached.", "error"); return; }
        
        const newUpdate = {
            id: Date.now() + Math.random(),
            type, content, mediaUrl: mediaUrl || null,
            timestamp: new Date().toISOString(),
            expiresAt: new Date(Date.now() + EXPIRY_HOURS * 60 * 60 * 1000).toISOString()
        };
        lawyerUpdates.updates.push(newUpdate);
        try {
            const newSha = await saveData(currentData, currentSha, token);
            currentSha = newSha;
            showStatus("✅ Update posted! Appears within 30 sec.", "success");
            document.getElementById("content").value = "";
            document.getElementById("mediaUrl").value = "";
            pendingImageFile = pendingVideoFile = null;
            document.getElementById("imageFileInput").value = "";
            document.getElementById("videoFileInput").value = "";
            document.getElementById("imagePreview").style.display = "none";
            document.getElementById("videoInfo").innerHTML = "";
            await loadData(token);
        } catch (err) { showStatus("Error: " + err.message, "error"); }
    }

    function showStatus(msg, type) {
        const div = document.getElementById("statusMsg");
        div.textContent = msg;
        div.className = `status ${type}`;
        setTimeout(() => div.className = "status", 4000);
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

    // UI toggles for media upload
    function toggleMediaUpload() {
        const type = document.getElementById("updateType").value;
        const imageGroup = document.getElementById("imageUploadGroup");
        const videoGroup = document.getElementById("videoUploadGroup");
        const mediaUrlGroup = document.getElementById("mediaUrlGroup");
        imageGroup.style.display = "none";
        videoGroup.style.display = "none";
        if (type === "image") { imageGroup.style.display = "block"; mediaUrlGroup.style.display = "block"; document.querySelector("#mediaUrlGroup label").innerHTML = "Image URL (optional)"; }
        else if (type === "video") { videoGroup.style.display = "block"; mediaUrlGroup.style.display = "block"; document.querySelector("#mediaUrlGroup label").innerHTML = "Video URL (optional)"; }
        else { mediaUrlGroup.style.display = "block"; if (type === "article") document.querySelector("#mediaUrlGroup label").innerHTML = "Article URL (required)"; else document.querySelector("#mediaUrlGroup label").innerHTML = "Media URL (optional)"; }
        if (type !== "image") { pendingImageFile = null; document.getElementById("imageFileInput").value = ""; document.getElementById("imagePreview").style.display = "none"; }
        if (type !== "video") { pendingVideoFile = null; document.getElementById("videoFileInput").value = ""; document.getElementById("videoInfo").innerHTML = ""; }
    }

    function handleImageFileSelect() {
        const file = document.getElementById("imageFileInput").files[0];
        if (file && file.type.startsWith("image/")) {
            pendingImageFile = file;
            const reader = new FileReader();
            reader.onload = e => { document.getElementById("imagePreview").src = e.target.result; document.getElementById("imagePreview").style.display = "block"; };
            reader.readAsDataURL(file);
        } else { pendingImageFile = null; document.getElementById("imagePreview").style.display = "none"; }
    }
    function handleVideoFileSelect() {
        const file = document.getElementById("videoFileInput").files[0];
        if (file && file.type.startsWith("video/")) {
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            if (file.size > MAX_VIDEO_SIZE_MB * 1024 * 1024) {
                document.getElementById("videoInfo").innerHTML = `<span style="color:#b91c1c;">❌ Exceeds ${MAX_VIDEO_SIZE_MB}MB (${sizeMB}MB)</span>`;
                pendingVideoFile = null;
                return;
            }
            pendingVideoFile = file;
            document.getElementById("videoInfo").innerHTML = `<span style="color:#166534;">✅ Ready: ${file.name} (${sizeMB} MB)</span>`;
        } else { pendingVideoFile = null; document.getElementById("videoInfo").innerHTML = ""; }
    }
    function clearImage() { pendingImageFile = null; document.getElementById("imageFileInput").value = ""; document.getElementById("imagePreview").style.display = "none"; }
    function clearVideo() { pendingVideoFile = null; document.getElementById("videoFileInput").value = ""; document.getElementById("videoInfo").innerHTML = ""; }

    // Event listeners
    document.getElementById("addLawyerBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await addOrUpdateLawyer(token);
    });
    document.getElementById("deleteLawyerBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await deleteLawyer(token);
    });
    document.getElementById("postUpdateBtn").addEventListener("click", async () => {
        const token = document.getElementById("githubToken").value.trim();
        if (!token) { showStatus("Enter GitHub token first.", "error"); return; }
        await postUpdate(token);
    });
    document.getElementById("updateType").addEventListener("change", toggleMediaUpload);
    document.getElementById("imageFileInput").addEventListener("change", handleImageFileSelect);
    document.getElementById("clearImageBtn").addEventListener("click", clearImage);
    document.getElementById("videoFileInput").addEventListener("change", handleVideoFileSelect);
    document.getElementById("clearVideoBtn").addEventListener("click", clearVideo);
    
    const storedToken = localStorage.getItem("lex_admin_token");
    if (storedToken) {
        document.getElementById("githubToken").value = storedToken;
        loadData(storedToken).catch(console.warn);
    }
    document.getElementById("githubToken").addEventListener("input", (e) => {
        const token = e.target.value.trim();
        if (token) { localStorage.setItem("lex_admin_token", token); loadData(token).catch(console.warn); }
    });
    document.getElementById("modeDisplay").innerHTML = '<i class="fas fa-shield-alt"></i> Admin: Manage lawyers, post updates, edit/delete any update. Expired updates auto-deleted.';
    toggleMediaUpload();
</script>
</body>
</html>
